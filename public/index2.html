<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manya - Positive Mistake Feedback</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .message {
      animation: glowZoomIn 0.8s ease-out forwards;
    }

    @keyframes glowZoomIn {
      0% {
        opacity: 0;
        transform: scale(0.6);
        text-shadow: 0 0 0 rgba(234, 179, 8, 0);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
        text-shadow: 0 0 30px rgba(234, 179, 8, 0.9);
      }
      100% {
        transform: scale(1);
        text-shadow: 0 0 15px rgba(234, 179, 8, 0.6);
      }
    }
  </style>
</head>
<body class="min-h-screen text-white p-6 flex items-center justify-center">

<div class="max-w-xl mx-auto text-center">
  <h1 class="text-3xl font-bold mb-8">Manya - Learning From Mistakes</h1>

  <div class="bg-white text-gray-900 rounded-3xl shadow-2xl p-10">
    <p class="text-lg mb-8">What is the main function of the skeleton?</p>

    <div class="grid grid-cols-1 gap-4">
      <div onclick="selectWrong(this)" class="option p-5 border-2 border-gray-200 rounded-2xl cursor-pointer hover:border-orange-400 text-lg">
        A. To produce blood cells only
      </div>
      <div onclick="selectCorrect(this)" class="option p-5 border-2 border-gray-200 rounded-2xl cursor-pointer hover:border-green-400 text-lg">
        B. To support the body and protect organs
      </div>
    </div>

    <div id="feedback" class="mt-12 hidden">
      <div id="motivational-text" class="message text-3xl font-semibold text-amber-500 leading-tight"></div>
      <p class="mt-6 text-gray-600">The correct answer is <span class="font-medium text-green-600">B</span></p>
      
      <button onclick="resetDemo()" 
              class="mt-10 px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-semibold">
        Try Next Question →
      </button>
    </div>
  </div>
</div>

<script>
const messages = [
  "We learn, we grow!",
  "Mistakes are stepping stones!",
  "No growth without mistakes!",
  "Every mistake makes us smarter!",
  "We’re getting better every time!",
  "This is how we learn!",
  "We keep growing!",
  "Mistakes help us improve!",
  "We’re building our knowledge!",
  "One mistake, one lesson!"
];

function selectWrong(el) {
  disableOptions();
  showFeedback();
}

function selectCorrect(el) {
  disableOptions();
  document.getElementById('feedback').classList.add('hidden');
  el.classList.add('border-green-500', 'bg-green-50');
}

function disableOptions() {
  document.querySelectorAll('.option').forEach(opt => {
    opt.style.pointerEvents = 'none';
    opt.classList.add('opacity-70');
  });
}

function showFeedback() {
  const feedback = document.getElementById('feedback');
  const textEl = document.getElementById('motivational-text');
  
  const randomMsg = messages[Math.floor(Math.random() * messages.length)];
  textEl.textContent = randomMsg;
  
  feedback.classList.remove('hidden');
}

function resetDemo() {
  document.querySelectorAll('.option').forEach(opt => {
    opt.style.pointerEvents = 'auto';
    opt.classList.remove('opacity-70', 'border-green-500', 'bg-green-50');
  });
  document.getElementById('feedback').classList.add('hidden');
}
</script>

</body>
</html>
